<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma</title>
    <link rel="shorcut icon" type="image/x-icon" href="/imgDaPaginaInicial/Logo+Estudos.png">
    <link rel="stylesheet" href="Cronograma.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <nav>
        <div class="nav-bar">
            <i class='bx bx-menu sidebarOpen'></i>
            <span class="logo navLogo"><a href="#"><img src="/imgDaPaginaInicial/+Estudos1.png" alt=""></a></span>

            <div class="menu">
                <div class="logo-toggle">
                    <span class="logo"><a href="#"><img src="/imgDaPaginaInicial/+Estudos1.png" alt=""></a></span>
                    <i class='bx bx-x siderbarClose'></i>
                </div>

                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Disciplinas</a></li>
                    <li><a href="#">Cronograma</a></li>
                    <li><a href="#">Contatos</a></li>
                </ul>
            </div>
            <div class="darkLight-searchBox">
                <div class="dark-light">
                    <i class='bx bx-moon moon'></i>
                    <i class='bx bx-sun sun'></i>
                </div>

                <div class="searchBox">
                    <div class="searchToggle">
                        <i class='bx bx-x cancel'></i>
                        <i class='bx bx-search search'></i>
                    </div>
                    <div class="search-field">
                        <input type="text" placeholder="Pesquisar...">
                        <i class='bx bx-search'></i>
                    </div>

                </div>
            </div>
        </div>
    </nav>

    <main class="cronograma">

    <h1>Cronograma de Estudos</h1>

    <p class="texto">
        Organize seus estudos durante a semana.
    </p>


    <section class="configuracao">

        <h2>Adicionar Horários</h2>

        <div class="horarios">

            <input type="text" placeholder="Ex: 07:00 - 09:00">

            <input type="text" placeholder="Ex: 09:00 - 11:00">

            <input type="text" placeholder="Ex: 11:00 - 12:00">

        </div>

    </section>


    <section class="configuracao">

        <h2>Adicionar Disciplinas</h2>

        <div class="disciplinas">

            <input type="text" placeholder="Ex: Física">

            <input type="text" placeholder="Ex: Literatura">

            <input type="text" placeholder="Ex: Geopolítica">

            <input type="text" placeholder="Ex: Química Orgânica">

        </div>

    </section>







    <script src="script.js"></script>
</body>
</html>
